<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C5 Valdelsa</title><style>body{background:#0a0a0a;color:#fff;font-family:Arial;text-align:center;margin:0;padding:10px}h1{color:#ffd700}button{background:#ffd700;border:0;padding:10px 14px;margin:3px;border-radius:10px;font-weight:bold;cursor:pointer}button:hover{background:#fff}input,select{padding:8px;margin:3px;border-radius:8px;border:0;width:90%;max-width:300px}table{margin:10px auto;background:#1a1a1a;border-collapse:collapse;width:100%;max-width:600px}td,th{border:1px solid #333;padding:6px;font-size:13px}.box{background:#1a1a1a;padding:12px;border-radius:12px;margin:10px auto;max-width:600px}</style></head><body><h1>⚽ C5 VALDELSA</h1><p>Stagione 2026-27</p><div><button onclick="showD('HOME')">HOME</button><button onclick="showD('CLASS')">CLASSIFICA</button><button onclick="showD('ROSA')">ROSA</button><button onclick="showD('CAL')">CALENDARIO</button><button onclick="showD('CUP')">COPPE</button><button onclick="showD('ADMIN')">ADMIN</button></div>
<div id="HOME" class="box"></div>
<div id="CLASS" class="box" style="display:none"><div id="classView"></div></div>
<div id="ROSA" class="box" style="display:none"><select id="rosaSel" onchange="showRosa()"><option value="A">Serie A</option><option value="B1">Serie B1</option><option value="B2">Serie B2</option></select><div id="rosaView"></div></div>
<div id="CAL" class="box" style="display:none"><div id="calView"></div></div>
<div id="CUP" class="box" style="display:none"><select id="cupSel" onchange="renderCup()"><option value="SUPER">Supercoppa</option><option value="CAMP">Coppa Campionato</option><option value="COPPA">Coppa</option></select><div id="cupView"></div></div>
<div id="ADMIN" class="box" style="display:none"><div id="adminView"></div></div>
<script>var TA=[{n:"C5 Valdelsa",d:100}];var TB1=[];var TB2=[];var M=[];var PL=[];var CUP=[];
var TEAMS={A:["C5 Valdelsa","Futsal Siena","Poggibonsi C5","Colle Val d'Elsa","San Gimignano","Certaldo C5"],B1:["Valdelsa B1","Barberino","Castelfiorentino","Empoli C5"],B2:["Valdelsa B2","Montaione","Gambassi","Montaione B"]};
function getTeams(l){return l==="A"?TEAMS.A:l==="B1"?TEAMS.B1:TEAMS.B2}
function calc(l){var t={};getTeams(l).forEach(function(n){t[n]={t:n,p:0,g:0,v:0,n:0,pers:0,gf:0,gs:0}});M.forEach(function(m){if(m.l!==l||m.s!=="GIOCATA")return;var a=t[m.c],b=t[m.t];if(!a||!b)return;a.g++;b.g++;a.gf+=m.gc;a.gs+=m.gt;b.gf+=m.gt;b.gs+=m.gc;if(m.gc>m.gt){a.v++;a.p+=3;b.pers++}else if(m.gc<m.gt){b.v++;b.p+=3;a.pers++}else{a.n++;b.n++;a.p++;b.p++}});return Object.values(t).sort(function(x,y){return y.p-x.p||(y.gf-y.gs)-(x.gf-x.gs)})}
function cupName(k){return k==="SUPER"?"Supercoppa":k==="CAMP"?"Coppa Campionato":"Coppa"}function showD(id){["HOME","CLASS","ROSA","CAL","CUP","ADMIN"].forEach(function(x){document.getElementById(x).style.display=x===id?"block":"none"});if(id==="HOME")renderHome();if(id==="CLASS")renderClass();if(id==="ROSA")showRosa();if(id==="CAL")renderCal();if(id==="CUP")renderCup();if(id==="ADMIN")renderAdmin()}
function renderHome(){var h="<b>Prossima Giornata</b><br>";var nx=M.filter(function(m){return m.s!=="GIOCATA"});if(!nx.length)h+="Nessuna partita in programma<br>Vai in ADMIN per aggiungere partite!";else nx.slice(0,5).forEach(function(m){h+=m.d+" "+m.o+" - Serie "+m.l+": "+m.c+" vs "+m.t+"<br>"});h+="<br><b>Ultimi Risultati</b><br>";var ul=M.filter(function(m){return m.s==="GIOCATA"}).slice(-5);if(!ul.length)h+="Ancora nessun risultato";else ul.forEach(function(m){h+=m.c+" "+m.gc+"-"+m.gt+" "+m.t+"<br>"});document.getElementById("HOME").innerHTML=h}
function renderClass(){var h="";["A","B1","B2"].forEach(function(l){h+="<h3>Serie "+l+"</h3><table><tr><th>Squadra</th><th>P</th><th>G</th><th>V</th><th>N</th><th>P</th><th>GF</th><th>GS</th></tr>";calc(l).forEach(function(r){h+="<tr><td>"+r.t+"</td><td><b>"+r.p+"</b></td><td>"+r.g+"</td><td>"+r.v+"</td><td>"+r.n+"</td><td>"+r.pers+"</td><td>"+r.gf+"</td><td>"+r.gs+"</td></tr>"});h+="</table>"});document.getElementById("classView").innerHTML=h}function renderRosaSel(){}
function showRosa(){var sq=document.getElementById("rosaSel").value;var h="<h3>Rosa Serie "+sq+"</h3><table><tr><th>Giocatore</th><th>Ruolo</th></tr>";var list=PL.filter(function(p){return p.sq===sq});if(!list.length)h+="<tr><td colspan=2>Nessun giocatore - aggiungilo in ADMIN</td></tr>";else list.forEach(function(p){h+="<tr><td>"+p.n+"</td><td>"+p.r+"</td></tr>"});h+="</table>";document.getElementById("rosaView").innerHTML=h}
function renderCal(){var h="<table><tr><th>G</th><th>Partita</th><th>Ris</th><th>Data</th></tr>";if(!M.length)h+="<tr><td colspan=4>Nessuna partita</td></tr>";M.forEach(function(m){h+="<tr><td>"+m.g+" - "+m.l+"</td><td>"+m.c+" vs "+m.t+"</td><td>"+(m.s==="GIOCATA"?m.gc+"-"+m.gt:m.s)+"</td><td>"+m.d+" "+m.o+"</td></tr>"});h+="</table>";document.getElementById("calView").innerHTML=h}function renderCup(){var k=document.getElementById("cupSel").value;var h="<h3>"+cupName(k)+"</h3><table><tr><th>Partita</th><th>Risultato</th></tr>";var list=CUP.filter(function(c){return c.k===k});if(!list.length)h+="<tr><td colspan=2>Nessuna partita di coppa</td></tr>";else list.forEach(function(c){h+="<tr><td>"+c.c+" vs "+c.t+"</td><td>"+(c.s==="GIOCATA"?c.gc+"-"+c.gt:c.s)+"</td></tr>"});h+="</table>";document.getElementById("cupView").innerHTML=h}
function renderAdmin(){document.getElementById("adminView").innerHTML="<h3>Aggiungi Giocatore</h3><input id='plN' placeholder='Nome giocatore'><br><select id='plSq'><option value='A'>Serie A</option><option value='B1'>Serie B1</option><option value='B2'>Serie B2</option></select><select id='plR'><option>Portiere</option><option>Difensore</option><option>Laterale</option><option>Pivot</option><option>Universale</option></select><br><button onclick='addPl()'>+ Aggiungi Giocatore</button><div id='plView'></div><hr><h3>Aggiungi Partita</h3><select id='mL' onchange='updTeams()'><option value='A'>Serie A</option><option value='B1'>Serie B1</option><option value='B2'>Serie B2</option></select><br><input id='mC' placeholder='Casa'><input id='mT' placeholder='Trasferta'><br><input id='mD' type='date'><input id='mO' type='time' value='21:00'><br><button onclick='addT()'>+ Aggiungi Partita</button><hr><h3>Aggiungi Risultato</h3><p>Scrivi numero partita (0 = prima) e risultato</p><input id='rI' type='number' placeholder='N. partita'><input id='rC' type='number' placeholder='Gol Casa'><input id='rT' type='number' placeholder='Gol Trasferta'><br><button onclick='addRes()'>Salva Risultato</button>";updPlView()}
function updPlView(){var el=document.getElementById("plView");if(!el)return;el.innerHTML="<br><b>Giocatori:</b><br>"+(PL.length?PL.map(function(p){return p.n+" ("+p.sq+" - "+p.r+")"}).join("<br>"):"Nessuno")}
function updTeams(){}function addPl(){var n=document.getElementById("plN").value.trim();if(!n)return alert("Scrivi il nome!");PL.push({n:n,sq:document.getElementById("plSq").value,r:document.getElementById("plR").value});document.getElementById("plN").value="";alert("Giocatore aggiunto!");updPlView()}
function addT(){var c=document.getElementById("mC").value.trim(),t=document.getElementById("mT").value.trim();if(!c||!t)return alert("Scrivi le 2 squadre!");M.push({l:document.getElementById("mL").value,c:c,t:t,d:document.getElementById("mD").value||"Da definire",o:document.getElementById("mO").value||"21:00",g:M.length+1,s:"DA GIOCARE",gc:0,gt:0});alert("Partita aggiunta!");renderCal()}
function addRes(){var i=parseInt(document.getElementById("rI").value);if(isNaN(i)||!M[i])return alert("Numero partita non valido!");M[i].gc=parseInt(document.getElementById("rC").value||0);M[i].gt=parseInt(document.getElementById("rT").value||0);M[i].s="GIOCATA";alert("Risultato salvato!")}showD("HOME");
</script></body></html>
