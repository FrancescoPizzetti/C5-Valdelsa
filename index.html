<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C5 Valdelsa</title><style>body{margin:0;font-family:system-ui;background:#0a0a0f;color:#fff}header{text-align:center;padding:18px}nav{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;background:#111;padding:9px}nav button{padding:10px 12px;border-radius:99px;border:1px solid #333;background:#222;color:#fff;font-weight:700}.on{background:#facc15!important;color:#000!important}.wrap{max-width:920px;margin:auto;padding:13px}.card{background:#1a1a22;border:1px solid #333;border-radius:18px;padding:15px;margin-bottom:12px}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #333;align-items:center;gap:8px}input,select<script>
var TA=[{n:"C5 Valdelsa",d:100}];var TB1=[];var TB2=[];var M=[];var CT={n:"C5 Valdelsa",p:"+39 333 0000000",e:"info@c5valdelsa.it",i:"@c5valdelsa",a:"Campo Val d'Elsa"};var CUPS={SUPER:null,CAMP:null,LEGA:null,MITROPA:null,CONF:null};var PL=[];var LOGO={};var CURC="a";var CURCAL="a";var CURCUP="SUPER";var CURD="A";function hPin(s){var x=0;for(var i=0;i<s.length;i++){x=(x*31+s.charCodeAt(i))>>>0}return x}function login(){if(hPin(document.getElementById("pin").value)===1571679681){document.getElementById("panel").classList.remove("hidden");render()}else alert("PIN errato")}function save(){try{localStorage.setItem("v19",JSON.stringify({TA:TA,TB1:TB1,TB2:TB2,M:M,CT:CT,CUPS:CUPS,PL:PL,LOGO:LOGO}))}catch(e){}render()}function load(){try{var s=JSON.parse(localStorage.getItem("v19")||"null");if(s){TA=s.TA||TA;TB1=s.TB1||[];TB2=s.TB2||[];M=s.M||[];CT=s.CT||CT;CUPS=s.CUPS||CUPS;PL=s.PL||[];LOGO=s.LOGO||{}}}catch(e){}}function show(id){["home","cal","class","coppe","contatti","admin"].forEach(function(x){document.getElementById(x).classList.toggle("hidden",x!==id);document.getElementById("b-"+x).classList.toggle("on",x===id)});render()}function showC(c){CURC=c;["a","b1","b2"].forEach(function(x){var e=document.getElementById("t-"+x);if(e)e.classList.toggle("on",x===c)});render()}function showCal(c){CURCAL=c;["a","b1","b2"].forEach(function(x){var e=document.getElementById("ca-"+x);if(e)e.classList.toggle("on",x===c)});render()}function showCup(c){CURCUP=c;["SUPER","CAMP","LEGA","MITROPA","CONF"].forEach(function(x){var e=document.getElementById("cup-"+x);if(e)e.classList.toggle("on",x===c)});render()}function showD(c){CURD=c;["A","B1","B2"].forEach(function(x){var e=document.getElementById("d-"+x);if(e)e.classList.toggle("on",x===c)});render()}
function addPl(){var n=document.getElementById("plN").value.trim();if(!n)return alert("Scrivi nome");PL.push({n:n,sq:document.getElementById("plSq").value,r:document.getElementById("plR").value,g:parseInt(document.getElementById("plG").value||0)});document.getElementById("plN").value="";save()}function delPl(i){if(!confirm("Eliminare "+PL[i].n+" dal campionato?"))return;PL.splice(i,1);save()}function trasfPl(i){var sqs=TA.concat(TB1,TB2).map(function(t){return t.n});var ns=prompt("Trasferire "+PL[i].n+" in quale squadra?\n"+sqs.join("\n"));if(!ns)return;PL[i].sq=ns;save();alert("Trasferito a "+ns)}function golPl(i,d){PL[i].g=Math.max(0,(PL[i].g||0)+d);save()}function saveLogo(){var s=document.getElementById("lgSq").value;var l=document.getElementById("lgL").value.trim();if(!l)return;LOGO[s]=l;save();alert("Logo salvato per "+s)}function showRosa(){var s=document.getElementById("rosaSel").value;var h="";for(var i=0;i<PL.length;i++){if(PL[i].sq===s)h+="<div class='row'><div>"+(LOGO[s]||"⚽")+" <b>"+PL[i].n+"</b> - "+PL[i].r+"</div><b>"+PL[i].g+" gol</b></div>"}document.getElementById("rosaView").innerHTML=h||"Nessun giocatore. Aggiungilo da Admin."}
function addT(k){var v=document.getElementById(k==="A"?"ta":k==="B1"?"tb1":"tb2").value.trim();if(!v)return;var o={n:v,d:100};if(k==="A")TA.push(o);if(k==="B1")TB1.push(o);if(k==="B2")TB2.push(o);save()}function delT(k,i){if(!confirm("Eliminare squadra?"))return;if(k==="A")TA.splice(i,1);if(k==="B1")TB1.splice(i,1);if(k==="B2")TB2.splice(i,1);save()}function saveCt(){CT={n:document.getElementById("ctN").value||CT.n,p:document.getElementById("ctP").value||CT.p,e:document.getElementById("ctE").value||CT.e,i:document.getElementById("ctI").value||CT.i,a:document.getElementById("ctA").value||CT.a};save();alert("Contatti salvati")}function saveM(){var c=document.getElementById("fc").value,t=document.getElementById("ft").value;if(c===t)return alert("Squadre diverse");var m={g:document.getElementById("fg").value,c:c,t:t,d:document.getElementById("fd").value,o:document.getElementById("fo").value,l:document.getElementById("fl").value,gc:document.getElementById("fgc").value,gt:document.getElementById("fgt").value,s:document.getElementById("fs").value};M.push(m);save()}function delM(i){if(!confirm("Eliminare partita?"))return;M.splice(i,1);save()}
function cupName(k){return k==="SUPER"?"Supercoppa":k==="CAMP"?"Coppa Campioni":k==="LEGA"?"Coppa di Lega":k==="MITROPA"?"Coppa Mitropa":"Conference Cup"}function genCup(){var k=document.getElementById("cupSel").value;var st=parseInt(document.getElementById("cupStart").value);if(!confirm("Generare "+cupName(k)+" da "+st+" squadre? Se c'era gia un tabellone lo sostituisce."))return;var rounds=[];var n=st;var rname=n===16?"16° di Finale":n===8?"8° di Finale":n===4?"Quarti di Finale":n===2?"Semifinale":"Finale";var ms=[];for(var i=0;i<n/2;i++)ms.push({a:"",b:"",ga:"",gb:"",dt:"",pl:"Andata"});rounds.push({name:rname,matches:ms});var nn=n/2;while(nn>1){var rn=nn===2?"Finale":nn===4?"Semifinale":nn===8?"Quarti di Finale":"8° di Finale";var m2=[];for(var j=0;j<nn/2;j++)m2.push({a:"",b:"",ga:"",gb:"",dt:"",pl:""});rounds.push({name:rn,matches:m2});nn=nn/2}CUPS[k]={rounds:rounds};save();alert("Tabellone "+cupName(k)+" creato!");}function setCupTeam(k,ri,mi,side,val){CUPS[k].rounds[ri].matches[mi][side]=val;save()}function setCupScore(k,ri,mi,f,val){CUPS[k].rounds[ri].matches[mi][f]=val;save()}function advCup(k,ri,mi){var mt=CUPS[k].rounds[ri].matches[mi];var ga=parseInt(mt.ga);var gb=parseInt(mt.gb);if(isNaN(ga)||isNaN(gb))return alert("Metti prima il risultato");var win=ga>gb?mt.a:gb>ga?mt.b:"";if(!win)return alert("Pareggio: in coppa serve un vincitore");if(ri+1>=CUPS[k].rounds.length){alert("Vincitore: "+win);return}var nm=CUPS[k].rounds[ri+1].matches[Math.floor(mi/2)];if(mi%2===0)nm.a=win;else nm.b=win;save();alert(win+" avanza")}</script><body><div class="wrap"><h1>⚽ MISTER 2026-27</h1><div class="tabs"><button id="d-HOME" onclick="showD('HOME')">HOME</button><button id="d-CLASS" onclick="showD('CLASS')">CLASSIFICHE</button><button id="d-ROSA" onclick="showD('ROSA')">ROSA</button><button id="d-CAL" onclick="showD('CAL')">CALENDARIO</button><button id="d-CUP" onclick="showD('CUP')">COPPE</button><button id="d-ADMIN" onclick="showD('ADMIN')">ADMIN</button></div><div id="HOME" class="card"><h2>🏠 Home</h2><div id="homeView"></div></div><div id="CLASS" class="card" style="display:none"><h2>📊 Classifiche</h2><div id="classView"></div></div><div id="ROSA" class="card" style="display:none"><h2>👕 Rosa</h2><select id="rosaSel" onchange="showRosa()"></select><div id="rosaView"></div></div><div id="CAL" class="card" style="display:none"><h2>📅 Calendario e Risultati</h2><div id="calView"></div></div><div id="CUP" class="card" style="display:none"><h2>🏆 Coppe</h2><select id="cupSel"><option value="SUPER">Supercoppa</option><option value="CAMP">Coppa Campioni</option><option value="LEGA">Coppa di Lega</option><option value="MITROPA">Coppa Mitropa</option><option value="CONF">Conference Cup</option></select><select id="cupStart"><option value="16">16 squadre</option><option value="8">8 squadre</option><option value="4">4 squadre</option><option value="2">2 squadre</option></select><button onclick="genCup()">Genera Tabellone</button><div id="cupView"></div></div><div id="ADMIN" class="card" style="display:none"><h2>🔐 Admin</h2><h3>➕ Giocatore</h3><input id="plN" placeholder="Nome giocatore"><input id="plSq" placeholder="Squadra"><input id="plR" placeholder="Ruolo (POR/DIF/CEN/ATT)"><input id="plG" type="number" placeholder="Gol" value="0"><button onclick="addPl()">Aggiungi Giocatore</button><div id="plView"></div><h3>🏟️ Squadra</h3><input id="ta" placeholder="Squadra Serie A"><button onclick="addT('A')">Aggiungi A</button><input id="tb1" placeholder="Squadra Serie B1"><button onclick="addT('B1')">Aggiungi B1</button><input id="tb2" placeholder="Squadra Serie B2"><button onclick="addT('B2')">Aggiungi B2</button><h3>📞 Contatti</h3><input id="ctN" placeholder="Nome Presidente"><input id="ctP" placeholder="Telefono"><input id="ctE" placeholder="Email"><input id="ctI" placeholder="Instagram"><input id="ctA" placeholder="Altro"><button onclick="saveCt()">Salva Contatti</button><h3>⚽ Partita</h3><input id="fg" placeholder="Giornata (es. 1)"><input id="fc" placeholder="Casa"><input id="ft" placeholder="Trasferta"><input id="fd" placeholder="Data"><input id="fo" placeholder="Ora"><input id="fl" placeholder="Luogo"><input id="fgc" type="number" placeholder="Gol Casa"><input id="fgt" type="number" placeholder="Gol Trasferta"><input id="fs" placeholder="Stato (PROGRAMMATA / GIOCATA)"><button onclick="saveM()">Salva Partita</button><div id="mView"></div></div></div><script>
function showD(id){["HOME","CLASS","ROSA","CAL","CUP","ADMIN"].forEach(function(x){document.getElementById(x).style.display=x===id?"block":"none";document.getElementById("d-"+x).classList.toggle("on",x===id)});if(id==="HOME")renderHome();if(id==="CLASS")renderClass();if(id==="ROSA")renderRosaSel();if(id==="CAL")renderCal();if(id==="CUP")renderCup();if(id==="ADMIN")renderAdmin()}
function renderHome(){var h="";h+="<b>Prossima Giornata</b><br>";var nx=M.filter(function(m){return m.s==="PROGRAMMATA"}).slice(0,4);if(!nx.length)h+="Nessuna partita in programma";nx.forEach(function(m){h+=m.g+"ª - "+m.c+" vs "+m.t+" - "+m.d+" "+m.o+" @"+m.l+"<br>"});h+="<br><b>Ultimi Risultati</b><br>";var lr=M.filter(function(m){return m.s==="GIOCATA"}).slice(-4).reverse();if(!lr.length)h+="Nessun risultato";lr.forEach(function(m){h+=m.c+" "+m.gc+"-"+m.gt+" "+m.t+"<br>"});document.getElementById("homeView").innerHTML=h}function renderClass(){var h="";["A","B1","B2"].forEach(function(l){h+="<h3>Serie "+l+"</h3><table><tr><th>Squadra</th><th>P</th><th>G</th><th>V</th><th>N</th><th>P</th><th>GF</th><th>GS</th></tr>";calc(l).forEach(function(r){h+="<tr><td>"+r.t+"</td><td><b>"+r.p+"</b></td><td>"+r.g+"</td><td>"+r.v+"</td><td>"+r.n+"</td><td>"+r.pers+"</td><td>"+r.gf+"</td><td>"+r.gs+"</td></tr>"});h+="</table>"});document.getElementById("classView").innerHTML=h}
function renderRosaSel(){var s=document.getElementById("rosaSel");var teams=TA.concat(TB1,TB2);s.innerHTML=teams.map(function(t){return "<option>"+t+"</option>"}).join("");showRosa()}
function showRosa(){var sq=document.getElementById("rosaSel").value;var h="<h3>"+sq+"</h3><table><tr><th>Nome</th><th>Ruolo</th><th>Gol</th></tr>";PL.filter(function(p){return p.sq===sq}).forEach(function(p){h+="<tr><td>"+p.n+"</td><td>"+p.r+"</td><td>"+p.g+"</td></tr>"});h+="</table>";document.getElementById("rosaView").innerHTML=h}function renderCal(){var h="<table><tr><th>G</th><th>Partita</th><th>Ris</th><th>Data</th></tr>";M.forEach(function(m,i){h+="<tr><td>"+m.g+"</td><td>"+m.c+" vs "+m.t+"</td><td>"+(m.s==="GIOCATA"?m.gc+"-"+m.gt:m.s)+"</td><td>"+m.d+" "+m.o+"</td></tr>"});h+="</table>";document.getElementById("calView").innerHTML=h}
function renderCup(){var k=document.getElementById("cupSel").value;var c=CUPS[k];var h="<h3>"+k+"</h3>";if(!c.rounds.length){document.getElementById("cupView").innerHTML="Nessun tabellone";return}c.rounds.forEach(function(r,ri){h+="<h4>"+r.name+"</h4>";r.matches.forEach(function(mt,mi){h+=mt.a+" <input style='width:40px' value='"+(mt.ga||"")+"' onchange=\"CUPS['"+k+"'].rounds["+ri+"].matches["+mi+"].ga=this.value;save()\"> - <input style='width:40px' value='"+(mt.gb||"")+"' onchange=\"CUPS['"+k+"'].rounds["+ri+"].matches["+mi+"].gb=this.value;save()\"> "+mt.b+" <button onclick=\"advCup('"+k+"',"+ri+","+mi+")\">➡️</button><br>"})});document.getElementById("cupView").innerHTML=h}
function renderAdmin(){document.getElementById("plView").innerHTML=PL.map(function(p){return p.n+" ("+p.sq+" - "+p.r+") "}).join("<br>");document.getElementById("mView").innerHTML=M.map(function(m){return m.g+"ª "+m.c+" "+m.gc+"-"+m.gt+" "+m.t+" ("+m.s+")"}).join("<br>")}
showD("HOME");</script></body></html>
