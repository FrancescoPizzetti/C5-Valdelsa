<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C5 Valdelsa</title><style>body{margin:0;font-family:system-ui;background:#0a0a0f;color:#fff}header{text-align:center;padding:20px}nav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;background:#111;padding:10px}nav button{padding:11px 14px;border-radius:99px;border:1px solid #333;background:#222;color:#fff;font-weight:700}.on{background:#facc15!important;color:#000!important}.wrap{max-width:900px;margin:auto;padding:14px}.card{background:#1a1a22;border:1px solid #333;border-radius:18px;padding:16px;margin-bottom:12px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #333;align-items:center;gap:8px}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #444;margin:6px 0;background:#000;color:#fff}.big{width:100%;padding:13px;border:0;border-radius:10px;background:#facc15;font-weight:900}.hidden{display:none}.del{background:#ef4444;color:#fff;border:0;padding:6px 9px;border-radius:7px}.badge{background:#facc15;color:#000;padding:4px 9px;border-radius:99px;font-size:12px;font-weight:800}</style></head><body><header><h1>C5 <span style="color:#facc15">VALDELSA</span></h1><p>2026/27 - Serie A</p></header><nav><button onclick="show('home')" id="b-home" class="on">Home</button><button onclick="show('cal')" id="b-cal">Calendario</button><button onclick="show('class')" id="b-class">Classifica</button><button onclick="show('admin')" id="b-admin">Admin</button></nav><div class="wrap"><div id="home"><div class="card"><h2>Prossima Partita</h2><div id="next"></div></div><div class="card"><h2>Ultimi Risultati</h2><div id="last"></div></div><div class="card"><h2>Top 5</h2><div id="top5"></div></div></div><div id="cal" class="hidden"><div class="card"><h2>Calendario Serie A</h2><div id="calList"></div></div></div><div id="class" class="hidden"><div class="card"><h2>Classifica Serie A</h2><p>Pti - G a][0]+"</div><b>"+cl[a][1].pti+" pti</b></div>";document.getElementById("top5").innerHTML=th;var nxt=null;for(var n=0;n<matches.length;n++){if(matches[n].s==="Programmata"){if(!nxt||matches[n].d<nxt.d)nxt=matches[n];}}document.getElementById("next").innerHTML=nxt?"<b>"+nxt.c+" vs "+nxt.t+"</b><br>"+nxt.d+" ore "+nxt.o+" - "+nxt.l:"Nessuna";var last=[];for(var j=matches.length-1;j>=0;j--){if(matches[j].s==="Giocata")last.push(matches[j]);if(last.length>=3)break;}var lh="";for(var k=0;k<last.length;k++)lh+="<div class='row'><div>"+last[k].c+" - "+last[k].t+"<br><small>"+last[k].d+"</small></div><b>"+last[k].gc+" - "+last[k].gt
