<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C5 Valdelsa</title><style>body{margin:0;font-family:system-ui;background:#0a0a0f;color:#fff}header{text-align:center;padding:20px}nav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;background:#111;padding:10px}nav button{padding:11px 14px;border-radius:99px;border:1px solid #333;background:#222;color:#fff;font-weight:700}.on{background:#facc15!important;color:#000!important}.wrap{max-width:900px;margin:auto;padding:14px}.card{background:#1a1a22;border:1px solid #333;border-radius:18px;padding:16px;margin-bottom:12px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #333}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #444;margin:6px 0;background:#000;color:#fff}.big{width:100%;padding:13px;border:0;border-radius:10px;background:#facc15;font-weight:900}.hidden{display:none}.del{background:#ef4444;color:#fff;border:0;padding:6px 9px;border-radius:7px}</style></head><body><header><h1>C5 <span style="color:#facc15">VALDELSA</span></h1><p>2026/27 - 6 Competizioni</p></header><nav><button onclick="show('home')" id="b-home" class="on">Home</button><button onclick="show('class')" id="b-class">Classifica</button><button onclick="show('admin')" id="b-admin">Admin</button></nav><div class="wrap"><div id="home"><div class="card"><b>Serie A</b> - Campionato<br><b>Serie B</b> - B1 B2<br><b>Supercoppa Champions League</b><br><b>Coppa di Lega</b><br><b>Coppa Mitropa</b><br><b>Conference Cup</b></div><div class="card"><h2>Top Serie A</h2><div id="top5"></div></div></div><div id="class" class="hidden"><div class="card"><h2>Classifica Serie A</h2><p>Pti - G - GF - GS - Disc. Da 50.</p><div id="ctA"></div></div></div><div id="admin" class="hidden"><div class="card"><h2>Admin PIN 1234</h2><input id="pin" type="password" placeholder="PIN"><button class="big" onclick="login()">Entra</button><div id="panel" class="hidden"><h3>Aggiungi Squadra</h3><input id="nt" placeholder="Nome squadra"><button class="big" onclick="addT()">Aggiungi</button><div id="list"></div><h3>Disciplina</h3><div id="disc"></div></div></div></div></div><script>var teams=[{n:"C5 Valdelsa",d:50,pti:0,g:0,gf:0,gs:0},{n:"Real Poggibonsi",d:50,pti:0,g:0,gf:0,gs:0},{n:"Futsal Siena",d:50,pti:0,g:0,gf:0,gs:0}];try{var s=JSON.parse(localStorage.getItem("v15")||"null");if(s)teams=s;}catch(e){}function save(){localStorage.setItem("v15",JSON.stringify(teams));render();}function show(id){var p=["home","class","admin"];for(var i=0;i<3;i++){document.getElementById(p[i]).classList.toggle("hidden",p[i]!==id);document.getElementById("b-"+p[i]).classList.toggle("on",p[i]===id);}render();}function login(){if(document.getElementById("pin").value==="1234"){document.getElementById("panel").classList.remove("hidden");alert("Benvenuto Mister!");}else alert("PIN sbagliato");}function addT(){var v=document.getElementById("nt").value.trim();if(!v)return;teams.push({n:v,d:50,pti:0,g:0,gf:0,gs:0});document.getElementById("nt").value="";save();}function delT(i){teams.splice(i,1);save();}function minus(i,pts){teams[i].d=Math.max(0,teams[i].d-pts);save();}function render(){var h="";var c=teams.slice().sort(function(a,b){if(b.pti!==a.pti)return b.pti-a.pti;if(Math.abs(b.d-a.d)>10)return b.d-a.d;return(b.gf-b.gs)-(a.gf-a.gs);});for(var i=0;i<c.length;i++){h+="<div class='row'><div>"+(i+1)+". "+c[i].n+"</div><b>"+c[i].pti+" pti - Disc. "+c[i].d+"</b></div>";}document.getElementById("ctA").innerHTML=h;document.getElementById("top5").innerHTML=h;var l="";for(var j=0;j<teams.length;j++){l+="<div class='row'><div>"+teams[j].n+" Disc. "+teams[j].d+"</div><button class='del' onclick='delT("+j+")'>X</button></div>";}document.getElementById("list").innerHTML=l;var d="";for(var k=0;k<teams.length;k++){d+="<div class='row'><div>"+teams[k].n+" "+teams[k].d+"</div><div><button class='del' onclick='minus("+k+",2)'>-2</button> <button class='del' onclick='minus("+k+",5)'>-5</button> <button class='del' onclick='minus("+k+",10)'>-10</button></div></div>";}document.getElementById("disc").innerHTML=d;}render();</script></body></html>
