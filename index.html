<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEST</title>
<style>body{background:#000;color:#fff;font-family:system-ui;text-align:center;padding:20px}button{padding:15px 25px;margin:10px;border-radius:99px;border:0;background:#facc15;font-weight:900;font-size:18px}.box{background:#222;padding:20px;border-radius:20px;margin-top:20px}.hidden{display:none}</style>
</head><body>
<h1>TEST C5 VALDELSA</h1>
<p>Se vedi questo, il sito si è aggiornato!</p>
<button onclick="show('home')">Home</button>
<button onclick="show('class')">Classifica</button>
<button onclick="show('admin')">Admin</button>
<div id="home" class="box"><h2>Sei in HOME ✅</h2><p>Serie A - Serie B - Supercoppa Champions League - Coppa di Lega - Mitropa - Conference Cup</p></div>
<div id="class" class="box hidden"><h2>CLASSIFICA ✅</h2><p>Pti - G - GF - GS - Disc.</p><p>Valdelsa 3 pti - Disc. 50</p></div>
<div id="admin" class="box hidden"><h2>ADMIN ✅</h2><input placeholder="PIN" style="padding:12px;border-radius:12px;width:80%"><br><br><button onclick="alert('PIN ok!')">Entra</button></div>
<script>
function show(id){
  document.getElementById('home').classList.add('hidden');
  document.getElementById('class').classList.add('hidden');
  document.getElementById('admin').classList.add('hidden');
  document.getElementById(id).classList.remove('hidden');
}
</script>
</body></html>
