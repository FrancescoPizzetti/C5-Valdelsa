<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C5 Valdelsa</title><style>*{box-sizing:border-box}:root{--main:#facc15}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0a0a0f;color:#fff;min-height:100vh}header{text-align:center;padding:28px 16px 20px}header img{width:120px;height:120px;object-fit:cover;border-radius:50%;border:3px solid var(--main);background:#000}header h1{margin:14px 0 4px;font-size:32px;letter-spacing:2px;font-weight:900}header h1 span{color:var(--main)}header p{margin:0;color:#a1a1aa;font-size:13px;text-transform:uppercase}.sync{display:inline-block;margin-top:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);padding:6px 14px;border-radius:99px;font-size:12px;color:#4ade80}nav{position:sticky;top:0;z-index:10;display:flex;gap:8px;justify-content:center;padding:12px;flex-wrap:wrap;background:rgba(10,10,15,.85);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08)}nav button{border:1px solid rgba(255,255,255,.1);padding:10px 18px;border-radius:99px;background:rgba(255,255,255,.06);color:#e4e4e7;font-weight:700;cursor:pointer}nav button.on{background:var(--main);color:#000}.wrap{max-width:920px;margin:auto;padding:18px}.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:20px;margin-bottom:16px}.card h2{margin:0 0 14px;font-size:19px}.row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.08);align-items:center;gap:10px}
input,select{width:100%;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.15);margin:6px 0;background:rgba(0,0,0,.4);color:#fff}.big{width:100%;padding:14px;border:0;border-radius:14px;background:var(--main);color:#000;font-weight:900;margin:8px 0;cursor:pointer;font-size:15px}.hidden{display:none}.small{color:#a1a1aa;font-size:13px}.badge{background:var(--main);color:#000;padding:6px 12px;border-radius:99px;font-weight:800;font-size:13px}table{width:100%;border-collapse:collapse}td,th{padding:11<div id="admin" class="hidden"><div class="card"><h2>🔒 Admin</h2><div id="loginBox"><p class="small">Sei Visitatore. Inserisci la password per entrare come Admin.</p><input id="pw" type="password" placeholder="Password Admin"><button class="big" onclick="login()">Entra come Admin</button></div><div id="adminPanel" class="hidden">
<button class="big" style="background:#ef4444;color:#fff" onclick="logout()">🚪 Esci da Admin / Logout</button>
<div class="card" style="background:rgba(250,204,21,.1);border-color:#facc15"><h2>🎨 Personalizza Grafica</h2><p><b>Titolo</b></p><input id="sTitle"><p><b>Sottotitolo</b></p><input id="sSub"><p><b>Colore principale</b></p><div class="colorRow"><div class="colorBtn sel" style="background:#facc15" onclick="pickColor('#facc15',this)"></div><div class="colorBtn" style="background:#ef4444" onclick="pickColor('#ef4444',this)"></div><div class="colorBtn" style="background:#3b82f6" onclick="pickColor('#3b82f6',this)"></div><div class="colorBtn" style="background:#22c55e" onclick="pickColor('#22c55e',this)"></div><div class="colorBtn" style="background:#a855f7" onclick="pickColor('#a855f7',this)"></div><div class="colorBtn" style="background:#f97316" onclick="pickColor('#f97316',this)"></div></div><p><b>Logo Campionato</b></p><img id="pMain" class="previewLogo" src="logo-campionato.png"><label class="fileLabel">📸 Scegli foto<input type="file" accept="image/*" style="display:none" onchange="uploadLogo(event,'logoMain')"></label><input id="sLogoMain" placeholder="oppure link https://..."><p><b>Logo Serie A</b></p><img id="pSerieA" class="previewLogo" src="logo-seriea.png"><label class="fileLabel">📸 Scegli foto<input type="file" accept="image/*" style="display:none" onchange="uploadLogo(event,'logoSerieA')"></label><input id="sLogoSerieA" placeholder="oppure link"><p><b>Logo Coppa di Lega</b></p><img id="pCoppa" class="previewLogo" src="logo-coppa.png"><label class="fileLabel">📸 Scegli foto<input type="file" accept="image/*" style="display:none" onchange="uploadLogo(event,'logoCoppa')"></label><input id="sLogoCoppa" placeholder="oppure link"><p><b>Logo Mitropa</b></p><img id="pMitropa" class="previewLogo" src="logo-mitropa.png"><label class="fileLabel">📸 Scegli foto<input type="file" accept="image/*" style="display:none" onchange="uploadLogo(event,'logoMitropa')"></label><input id="sLogoMitropa" placeholder="oppure link"><button class="big" onclick="saveSettings()">💾 SALVA GRAFICA PER TUTTI</button></div><div class="card"><h2>🔑 Cambia Password Admin</h2><p class="small">Qui cambi la password, senza GitHub. Da ora in poi si entra con la nuova.</p><input id="newPw" type="password" placeholder="Nuova password"><input id="newPw2" type="password" placeholder="Ripeti nuova password"><button class="big" onclick="changePw()">Cambia Password</button></div>
<div class="card"><h2>📜 Regola Avulsa</h2><p class="small">Questa frase si vede in Classifica. Modificala da qui.</p><input id="fRegola" placeholder="Es: In caso di parita'..."><button class="big" onclick="saveRegola()">Salva Regola</button></div>
<div class="card"><h2>🏆 Aggiungi Competizione</h2><input id="fComp" placeholder="Es: Supercoppa"><button class="big" onclick="addComp()">Aggiungi Competizione</button><div id="compList"></div></div>
<h3>🏆 Squadra del Campionato</h3><input id="fTeam" placeholder="Nome nuova squadra"><button class="big" onclick="addTeam()">Aggiungi Squadra</button><div id="teamsList"></div>
<h3>⚽ Partita</h3><select id="fCasa"></select><select id="fTras"></select><input id="fData" type="date"><input id="fOra" type="time" value="21:00"><input id="fLuogo" placeholder="Luogo"><input id="fGolC" type="number" placeholder="Gol Casa"><input id="fGolT" type="number" placeholder="Gol Trasferta"><select id="fStato"><option>Programmata</option><option>Giocata</option></select><button class="big" onclick="saveMatch()">Salva Partita</button><div id="matchesList"></div>
<h3>👤 Giocatore Valdelsa</h3><input id="fNome" placeholder="Nome"><input id="fRuolo" placeholder="Ruolo"><input id="fGol" type="number" placeholder="Gol"><button class="big" onclick="addPlayer()">Aggiungi Giocatore</button><div id="playersList"></div>
<h3>🟨 Disciplina - Coppa Disciplina</h3><p class="small">Scegli squadra e clicca -2 / -5 / -10. La classifica si aggiorna da sola.</p><select id="dTeam"></select><div style="display:flex;gap:8px"><button class="big" style="background:#facc15" onclick="addDisc(-2)">-2 Punti</button><button class="big" style="background:#f97316" onclick="addDisc(-5)">-5 Punti</button><button class="big" style="background:#ef4444" onclick="addDisc(-10)">-10 Punti</button></div><div id="discList"></div>
<h3>📞 Aggiungi Contatto</h3><input id="cNome" placeholder="Nome - Es: Mister Francesco"><input id="cTel" placeholder="Telefono - Es: 3331234567"><input id="cRuolo" placeholder="Ruolo - Es: Mister / Presidente"><button class="big" onclick="addContatto()">+ Aggiungi Contatto</button><div id="contattiAdminList"></div>
</div></div></div></div><script>
const DB="https://c5-valdelsa-default-rtdb.firebaseio.com/valdelsa.json";
let teams=["C5 Valdelsa","Real Poggibonsi","Futsal Siena","Colle Valdelsa C5","San Gimignano","Monteriggioni C5","Barberino C5","Certaldo Futsal"];
let matches=[{casa:"C5 Valdelsa",tras:"Real Poggibonsi",data:"2026-11-21",[STRIPPED]
let players=[{n:"Francesco P.",r:"Mister",g:0},{n:"Mario Rossi",r:"Portiere",g:0},{n:"Luca Bianchi",r:"Difensore",g:2}];
let contacts=[{n:"Mister Francesco",tel:"3331234567",ruolo:"Mister"}];
let comps=["Serie A","Coppa di Lega","Coppa Mitropa"];
let disciplina={};
let settings={title:"C5 VALDELSA",sub:"Lega di Calcio a 5 Val d'Elsa • 2026/27",color:"#facc15",logoMain:"logo-campionato.png",logoSerieA:"logo-seriea.png",logoCoppa:"logo-coppa.png",logoMitropa:"logo-mitropa.png",regola:"In caso di parita' conta prima la differenza reti, poi i gol fatti.",adminHash:740322054};
let tmpColor="#facc15";let isAdmin=false;
function hashPw(v){let h=0;for(let i=0;i<v.length;i++){h=(h*31+v.charCodeAt(i))|0}return h}
async function load(){try{let r=await fetch(DB);let d=await r.json();if(d){if(d.teams)teams=d.teams;if(d.matches)matches=d.matches;if(d.players)players=d.players;if(d.contacts)contacts=d.contacts;if(d.comps)comps=d.comps;if(d.disciplina)disciplina=d.disciplina;if(d.settings)settings={...settings,...d.settings}}}catch(e){}applySettings();render()}
async function save(){document.getElementById('sync').textContent="● Salvataggio...";await fetch(DB,{method:"PUT",body:JSON.stringify({teams,matches,players,contacts,comps,disciplina,settings})});document.getElementById('sync').textContent="● LIVE - Salvato!";render()}
function applySettings(){document.documentElement.style.setProperty('--main',settings.color);tmpColor=settings.color;document.getElementById('hdrLogo').src=settings.logoMain;document.getElementById('hdrTitle').innerHTML=settings.title.replace("VALDELSA","<span>VALDELSA</span>");document.getElementById('hdrSub').textContent=settings.sub;document.getElementById('sTitle').value=settings.title;document.getElementById('sSub').value=settings.sub;document.getElementById('sLogoMain').value=settings.logoMain;document.getElementById('sLogoSerieA').value=settings.logoSerieA;document.getElementById('sLogoCoppa').value=settings.logoCoppa;document.getElementById('sLogoMitropa').value=settings.logoMitropa;document.getElementById('pMain').src=settings.logoMain;document.getElementById('pSerieA').src=settings.logoSerieA;document.getElementById('pCoppa').src=settings.logoCoppa;document.getElementById('pMitropa').src=settings.logoMitropa;document.getElementById('fRegola').value=settings.regola||"";document.getElementById('regolaView').textContent=settings.regola||""}function pickColor(c,el){tmpColor=c;document.querySelectorAll('.colorBtn').forEach(b=>b.classList.remove('sel'));el.classList.add('sel');document.documentElement.style.setProperty('--main',c)}
function uploadLogo(ev,key){let f=ev.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=e=>{let v=e.target.result;if(key==='logoMain'){settings.logoMain=v;document.getElementById('sLogoMain').value=v;document.getElementById('pMain').src=v}if(key==='logoSerieA'){settings.logoSerieA=v;document.getElementById('sLogoSerieA').value=v;document.getElementById('pSerieA').src=v}if(key==='logoCoppa'){settings.logoCoppa=v;document.getElementById('sLogoCoppa').value=v;document.getElementById('pCoppa').src=v}if(key==='logoMitropa'){settings.logoMitropa=v;document.getElementById('sLogoMitropa').value=v;document.getElementById('pMitropa').src=v}alert("Foto caricata! Ora clicca SALVA GRAFICA")};rd.readAsDataURL(f)}
function saveSettings(){settings.title=document.getElementById('sTitle').value||"C5 VALDELSA";settings.sub=document.getElementById('sSub').value||settings.sub;settings.color=tmpColor;if(document.getElementById('sLogoMain').value)settings.logoMain=document.getElementById('sLogoMain').value;if(document.getElementById('sLogoSerieA').value)settings.logoSerieA=document.getElementById('sLogoSerieA').value;if(document.getElementById('sLogoCoppa').value)settings.logoCoppa=document.getElementById('sLogoCoppa').value;if(document.getElementById('sLogoMitropa').value)settings.logoMitropa=document.getElementById('sLogoMitropa').value;applySettings();save();alert("Grafica salvata per tutti!")}
function show(id){['home','cal','class','coppe','team','contatti','admin'].forEach(x=>{document.getElementById(x).classList.toggle('hidden',x!==id);document.getElementById('b-'+x).classList.toggle('on',x===id)});render()}
function login(){if(hashPw(document.getElementById('pw').value)===settings.adminHash){isAdmin=true;document.getElementById('loginBox').classList.add('hidden');document.getElementById('adminPanel').classList.remove('hidden');alert("Benvenuto Mister!")}else alert("Password sbagliata!")}
function logout(){isAdmin=false;document.getElementById('loginBox').classList.remove('hidden');document.getElementById('adminPanel').classList.add('hidden');document.getElementById('pw').value="";show('home');alert("Sei uscito, ora sei Visitatore")}
function changePw(){let a=document.getElementById('newPw').value,b=document.getElementById('newPw2').value;if(!a||a.length<4)return alert("Password troppo corta, minimo 4 caratteri");if(a!==b)return alert("Le 2 password non sono uguali!");settings.adminHash=hashPw(a);document.getElementById('newPw').value="";document.getElementById('newPw2').value="";save();alert("Password cambiata! Da ora si entra con la nuova.")}
function saveRegola(){settings.regola=document.getElementById('fRegola').value;save();alert("Regola salvata!")}
function addComp(){let n=document.getElementById('fComp').value.trim();if(!n)return alert("Scrivi nome competizione");if(comps.includes(n))return alert("Esiste gia'");comps.push(n);document.getElementById('fComp').value="";save();alert("Competizione aggiunta!")}
function delComp(i){if(!confirm("Cancellare "+comps[i]+"?"))return;comps.splice(i,1);save()}
function saveMatch(){let m={casa:document.getElementById('fCasa').value,tras:document.getElementById('fTras').value,data:document.getElementById('fData').value,[STRIPPED] i=matches.findIndex(x=>x.casa===m.casa&&x.tras===m.tras&&x.data===m.data);if(i>=0)matches[i]=m;else matches.push(m);save();alert("Salvato per tutti!")}
function addPlayer(){let n=document.getElementById('fNome').value;if(!n)return alert("Metti nome");players.push({n:n,r:document.getElementById('fRuolo').value||"Giocatore",g:parseInt(document.getElementById('fGol').value||0)});document.getElementById('fNome').value="";save();alert("Giocatore aggiunto!")}
function addTeam(){let n=document.getElementById('fTeam').value.trim();if(!n)return alert("Metti nome");if(teams.includes(n))return alert("Esiste gia'");teams.push(n);document.getElementById('fTeam').value="";save();alert("Squadra aggiunta!")}
function delTeam(i){if(!confirm("Cancellare "+teams[i]+"?"))return;teams.splice(i,1);save()}
function delMatch(i){if(!confirm("Cancellare partita?"))return;matches.splice(i,1);save()}
function delPlayer(i){if(!confirm("Cancellare "+players[i].n+"?"))return;players.splice(i,1);save()}function addDisc(p){let t=document.getElementById('dTeam').value;disciplina[t]=(disciplina[t]||0)+p;save();alert(t+" "+p+" punti disciplina!")}
function addContatto(){let n=document.getElementById('cNome').value.trim(),tel=document.getElementById('cTel').value.trim();if(!n||!tel)return alert("Metti nome e telefono!");contacts.push({n:n,tel:tel,ruolo:document.getElementById('cRuolo').value||""});document.getElementById('cNome').value="";document.getElementById('cTel').value="";document.getElementById('cRuolo').value="";save();alert("Contatto aggiunto!")}
function delContatto(i){if(!confirm("Cancellare "+contacts[i].n+"?"))return;contacts.splice(i,1);save()}
function calc(){let t={};teams.forEach(x=>t[x]={pti:0,g:0,gf:0,gs:0});matches.filter(m=>m.stato==="Giocata"&&m.golC!=="").forEach(m=>{let a=parseInt(m.golC),b=parseInt(m.golT);if(!t[m.casa])t[m.casa]={pti:0,g:0,gf:0,gs:0};if(!t[m.tras])t[m.tras]={pti:0,g:0,gf:0,gs:0};t[m.casa].g++;t[m.tras].g++;t[m.casa].gf+=a;t[m.casa].gs+=b;t[m.tras].gf+=b;t[m.tras].gs+=a;if(a>b)t[m.casa].pti+=3;else if(b>a)t[m.tras].pti+=3;else{t[m.casa].pti++;t[m.tras].pti++}});Object.keys(disciplina).forEach(k=>{if(t[k])t[k].pti+=disciplina[k]});return Object.entries(t).sort((a,b)=>b[1].pti-a[1].pti||(b[1].gf-b[1].gs)-(a[1].gf-a[1].gs))}
function render(){let next=matches.filter(m=>m.stato==="Programmata").sort((a,b)=>a.data.localeCompare(b.data))[0];document.getElementById('nextMatch').innerHTML=next?`<b>${next.casa} vs ${next.tras}</b><br><span class="small" style="color:#000">${next.data} ore ${next.ora} - ${next.luogo}</span>`:"Nessuna";let last=matches.filter(m=>m.stato==="Giocata").slice(-3).reverse();document.getElementById('lastResults').innerHTML=last.map(m=>`<div class="row"><div>${m.casa} - ${m.tras}<br><span class="small">${m.data}</span></div><b>${m.golC} - ${m.golT}</b></div>`).join("")||"Nessun risultato";let cl=calc();document.getElementById('top5').innerHTML=cl.slice(0,5).map((x,i)=>`<div class="row"><div>${i+1}. ${x[0]}</div><b>${x[1].pti} pti</b></div>`).join("");document.getElementById('compHome').innerHTML=comps.slice(0,3).map((c,i)=>`<div><img src="${i===0?settings.logoSerieA:i===1?settings.logoCoppa:settings.logoMitropa}"><b>${c}</b></div>`).join("");document.getElementById('coppeList').innerHTML=comps.map(c=>`<div class="row"><div><b>${c}</b></div><span class="badge">Competizione</span></div>`).join("");document.getElementById('compList').innerHTML=comps.map((c,i)=>`<div class="row"><div>${c}</div>${isAdmin?`<button class="del" onclick="delComp(${i})">X</button>`:""}</div>`).join("");document.getElementById('calList').innerHTML=[...matches].sort((a,b)=>a.data.localeCompare(b.data)).map(m=>`<div class="row"><div><b>${m.casa} vs ${m.tras}</b><br><span class="small">${m.data} ${m.ora} - ${m.luogo}</span></div>${m.stato==="Giocata"?`<b>${m.golC}-${m.golT}</b>`:`<span class="badge">${m.stato}</span>`}</div>`).join("");document.getElementById('classTable').innerHTML=cl.map((x,i)=>`<tr><td>${i+1}</td><td>${x[0]}</td><td><b>${x[1].pti}</b></td><td>${x[1].g}</td><td>${x[1].gf}</td><td>${x[1].gs}</td><td>${disciplina[x[0]]||0}</td></tr>`).join("");document.getElementById('teamList').innerHTML=players.map(p=>`<div class="row"><div><b>${p.n}</b><br><span class="small">${p.r}</span></div><span class="badge">${p.g} gol</span></div>`).join("");document.getElementById('scorers').innerHTML=[...players].sort((a,b)=>b.g-a.g).slice(0,5).map(p=>`<div class="row"><div>${p.n}</div><b>${p.g} gol</b></div>`).join("");document.getElementById('contattiList').innerHTML=contacts.length?contacts.map(c=>`<div class="row"><div><b>${c.n}</b><br><span class="small">${c.ruolo}</span></div><a href="tel:${c.tel}" style="color:var(--main);font-weight:800;text-decoration:none">📞 ${c.tel}</a></div>`).join(""):"Nessun contatto ancora";document.getElementById('contattiAdminList').innerHTML=contacts.map((c,i)=>`<div class="row"><div>${c.n} - ${c.tel} (${c.ruolo})</div><button class="del" onclick="delContatto(${i})">X</button></div>`).join("");let o=teams.map(t=>`<option>${t}</option>`).join("");document.getElementById('fCasa').innerHTML=o;document.getElementById('fTras').innerHTML=o;document.getElementById('dTeam').innerHTML=o;document.getElementById('fData').value=new Date().toISOString().slice(0,10);document.getElementById('teamsList').innerHTML=teams.map((t,i)=>`<div class="row"><div>${t}</div><button class="del" onclick="delTeam(${i})">X</button></div>`).join("");document.getElementById('matchesList').innerHTML=matches.map((m,i)=>`<div class="row"><div><small>${m.data} - ${m.casa} vs ${m.tras} ${m.stato==="Giocata"?m.golC+"-"+m.golT:""}</small></div><button class="del" onclick="delMatch(${i})">X</button></div>`).join("");document.getElementById('playersList').innerHTML=players.map((p,i)=>`<div class="row"><div>${p.n} - ${p.r} (${p.g} gol)</div><button class="del" onclick="delPlayer(${i})">X</button></div>`).join("");document.getElementById('discList').innerHTML=Object.entries(disciplina).map(([k,v])=>`<div class="row"><div>${k}</div><b>${v} punti</b></div>`).join("")||"Nessuna penalita'"}
load();setInterval(load,10000);
</script></body></html>
